[project]
name = "waycast"
version = "0.1.0"
description = "A pluggable agent service: unified input in, arbitrary combination of output-module units out, fire-and-forget delivery with immediate results feeding the next invocation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
# 版本策略：语义化区间（下界=当前目标版本，上界=下一 major），可复现性由 uv.lock 保证。
dependencies = [
    "fastapi>=0.162.0,<1",
    "httpx2>=2.16,<3",
    "jsonschema>=4.23,<5",
    "langchain-core>=1.7.1,<2",
    "langchain-openai>=1.7.3,<2",
    # [mcp] extra 是 ADR-0004 的要求（langchain.mcp / MCPAdapter），当前代码尚未用到也须保留。
    "langchain[mcp]>=1.4.7,<2",
    "langgraph>=1.2.18,<2",
    "pydantic>=2.14.1,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.54.0,<1",
    # examples/ 参考模块客户端直接 import websockets（tests 亦依赖）；server 侧 /ws/modules
    # 的 WS 实现同样经 uvicorn[standard] 用到它。此前只靠传递依赖兜底，现显式声明。
    "websockets>=17.4,<18",
]

[project.scripts]
waycast = "waycast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/waycast"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "real_model: runs against the real model configured in .env (network required)",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "examples"]

# lint 规则集 = ruff 内置默认（四仓一致，不另选规则族；生效规则集由 uv.lock 钉死的 ruff 版本决定）。
