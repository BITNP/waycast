[project]
name = "waycast"
version = "0.1.0"
description = "A pluggable agent service: unified input in, arbitrary combination of output-module units out, fire-and-forget delivery with immediate results feeding the next invocation."
readme = "README.md"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[openai,mcp]>=1.4.7",
    "langchain-core>=1.7.1",
    "langgraph>=1.2.18",
    "langchain-openai>=1.7.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx2>=2.16.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.1",
]

[project.scripts]
waycast = "waycast.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
markers = [
    "real_model: runs against the real model configured in .env (network required)",
]

