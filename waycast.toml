# Waycast Agent system-prompt customization.
#
# This file is optional.  When present, the Agent system prompt is built as:
#   [auto-generated output-module catalog]  +  [user instructions below]
# so the pluggable output-module protocol spec always stays in the prompt.
#
# The file path defaults to ./waycast.toml; override with WAYCAST_AGENT_CONFIG.
#
# Every field is optional.  "custom_prefix" / "custom_suffix" are extra
# free-form instructions placed before / after the role-and-scenario lines.

[agent.system_prompt]
role = ""            # e.g. 你的角色：一位贴心的生活助理
scenario = ""        # e.g. 使用场景：帮我处理日常提醒、天气与日志归档
custom_prefix = ""   # extra instructions placed before role/scenario lines
custom_suffix = ""   # extra instructions placed after role/scenario lines
